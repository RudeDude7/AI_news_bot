name: Daily News Fetcher

# Trigger the workflow at midnight UTC every day or manually via GitHub UI
on:
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Run the Python script to fetch the news
      - name: Fetch news
        run: python scripts/fetch_news.py